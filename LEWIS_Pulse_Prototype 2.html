t:"Recovery",targets:{PH:3,EM:2,EN:2},intensity:"gentle",format:"Three nights with stay and all meals included, in a group of twelve. Unhurried mobility, guided rest, and long unscheduled afternoons.",design:"it gives your body a longer experience of genuine rest without asking you to perform anything, which is the right shape while stopping is not yet restorative on its own.",walk:"Three nights where rest is the whole point, and a closing routine you take home. In a controlled trial, structured recovery training of this kind improved people’s recovery, their reported sleep, and their sense of wellbeing.",cite:"Recovery skills training. Hahn and colleagues, 2011",host:"Meera Nair",nextDates:"14 to 17 Aug",placesLeft:4,price:"₹42,000"},{id:"stillness",name:"Stillness Immersion",type:"residential",cat:"Settling",targets:{EM:3,PH:2},intensity:"gentle",format:"Four nights, stay and meals included. Breath led movement morning and evening, with silence held for part of each day.",design:"it works on the settling itself rather than on your schedule, and four nights is long enough for a nervous system to believe the change.",walk:"A way of settling that does not depend on the room you learned it in. Reviews of gentle, breath led movement consistently report lower perceived stress among the people who take part.",cite:"Gentle breath led movement. Sharma, 2014",host:"Anand Varma",nextDates:"5 to 9 Sep",placesLeft:6,price:"₹54,000"},{id:"nature-reset",name:"Nature Reconnect Residential",type:"residential",cat:"Surroundings",targets:{EV:3,EM:2,PH:1},intensity:"moderate",format:"Three nights in a green setting, stay and meals included. Walking, water, and long hours outdoors with nothing scheduled after dark.",design:"it changes the setting rather than asking you to feel differently inside the one you are in, which is the faster route when place is part of the pattern.",walk:"A reset that your senses remember longer than your calendar does. Around two hours a week of nature contact is associated with better self reported health and wellbeing.",cite:"Nature contact. White and colleagues, 2019",host:"Ravi Menon",nextDates:"22 to 25 Aug",placesLeft:8,price:"₹38,000"},{id:"direction-retreat",name:"Direction Retreat",type:"residential",cat:"Meaning",targets:{MN:3,CG:2,AG:1},intensity:"moderate",format:"Three nights, stay and meals included. Guided writing, small group conversation, and a long solo walk on the final morning.",design:"it treats searching as an active state rather than a problem, and gives you the uninterrupted hours that thinking of this kind actually needs.",walk:"A clearer sense of what you are aiming at, written in your own words. Structured writing programs are associated with clearer self understanding over time.",cite:"Structured writing programs. Pennebaker and Chung, 2011",host:"Divya Rao",nextDates:"12 to 15 Sep",placesLeft:5,price:"₹44,000"},{id:"kalari-residential",name:"Kalaripayattu Foundations",type:"residential",cat:"Movement",targets:{PH:2,EN:3,AG:2},intensity:"active",format:"Four nights, stay and meals included. Traditional breath led movement taught from the beginning, twice daily, with rest built into the afternoons.",design:"it rebuilds energy through structured movement and breath rather than through rest alone, which suits a body that is under used rather than overspent.",walk:"A practice with centuries behind it and a foundation you can keep training. Breath led traditional movement is linked in reviews to lower perceived stress.",cite:"Gentle breath led movement. Sharma, 2014",host:"Gurukkal Sanjay",nextDates:"29 Aug to 2 Sep",placesLeft:3,price:"₹48,000"},{id:"wind-down",name:"Evening Wind Down Series",type:"day",cat:"Settling",targets:{EM:3,PH:2},intensity:"gentle",format:"Four sessions of forty five minutes, early evening, in a small group. Sessions only, no stay and no meals.",design:"the early evening timing sits inside the window where your day refuses to end, so you practise the skill at the hour you actually need it.",walk:"A closing ritual that is yours, and that keeps working long after the four sessions end. Reviews of gentle, breath led movement report lower perceived stress.",cite:"Gentle breath led movement. Sharma, 2014",host:"Anand Varma",nextDates:"Thursdays from 7 Aug",placesLeft:7,price:"₹6,400"},{id:"sleep-reset",name:"Sleep and Recovery Reset",type:"day",cat:"Recovery",targets:{PH:3,EN:2},intensity:"gentle",format:"Seven guided sessions across four weeks, small group, with a Lifed Healthmate. Sessions only.",design:"it teaches the transition into rest rather than asking you to already be rested, and it works on exactly the area this reflection names as your starting point.",walk:"A repeatable way of ending a day. In a controlled trial, a structured recovery course of this kind improved people’s recovery, their reported sleep, and their sense of wellbeing.",cite:"Recovery skills training. Hahn and colleagues, 2011",host:"Meera Nair",nextDates:"Tuesdays from 5 Aug",placesLeft:9,price:"₹11,500"},{id:"low-movement",name:"Low Intensity Movement Series",type:"day",cat:"Energy",targets:{EN:3,PH:2},intensity:"gentle",format:"Six gently paced sessions over six weeks. No performance tracking of any kind, and no stay.",design:"it is deliberately gentle, which is the right shape while your energy is the thin part of the field rather than your willingness.",walk:"A pace you can actually keep. In randomised trials with adults running low on energy, low intensity movement raised energy and reduced fatigue, and did so more than harder exercise.",cite:"Low intensity movement. Puetz, Flowers and O’Connor, 2008",host:"Sneha Iyer",nextDates:"Saturdays from 9 Aug",placesLeft:11,price:"₹8,900"},{id:"small-circles",name:"Small Circles",type:"day",cat:"Connection",targets:{RL:3,EM:2},intensity:"gentle",format:"Six weekly evenings, in person, in a group of eight that stays the same throughout.",design:"the same eight people every week is the part that matters. Familiarity is what turns a group into company, and company is what your reading is short of.",walk:"A handful of people who know where you are. Supportive presence has long been found to lighten the felt weight of a demanding season.",cite:"Supportive presence. Cohen and Wills, 1985. Holt-Lunstad and colleagues, 2010",host:"Priya Kurian",nextDates:"Wednesdays from 6 Aug",placesLeft:3,price:"₹7,800"},{id:"green-hours",name:"Green Hours",type:"day",cat:"Surroundings",targets:{EV:3,EN:2,EM:1},intensity:"moderate",format:"Eight weekend morning walks in green space, two hours each, joined whenever you can make them.",design:"it asks for two hours a week and no commitment beyond the morning you turn up, which fits a life that has no room for anything larger.",walk:"A standing reason to be outdoors. Around two hours a week of nature contact is associated with better self reported health and wellbeing.",cite:"Nature contact. White and colleagues, 2019",host:"Ravi Menon",nextDates:"Sundays from 3 Aug",placesLeft:14,price:"₹4,200"},{id:"working-differently",name:"Working Differently Sessions",type:"day",cat:"Agency",targets:{AG:3,MN:2},intensity:"moderate",format:"Four small group sessions plus one solo review at the end. Sessions only.",design:"it works on the shape of your week rather than on your effort inside it, which is the part your reading suggests is stuck.",walk:"Two or three concrete changes to how your role runs. Small, self directed changes of this kind are associated with higher engagement at work.",cite:"Job crafting. Wrzesniewski and Dutton, 2001",host:"Nikhil Das",nextDates:"Mondays from 4 Aug",placesLeft:6,price:"₹9,600"},{id:"direction-sessions",name:"Direction and Values Sessions",type:"day",cat:"Meaning",targets:{MN:3,CG:2},intensity:"gentle",format:"Four guided writing and conversation sessions across four weeks, small group.",design:"it is built for the state you are actually in, which is searching rather than lost, and it treats that as an active thing.",walk:"A clearer sense of what you are aiming at. Structured writing programs are associated with clearer self understanding over time.",cite:"Structured writing programs. Pennebaker and Chung, 2011. Ryff, 1989",host:"Divya Rao",nextDates:"Fridays from 8 Aug",placesLeft:8,price:"₹8,200"},{id:"money-ease",name:"Money and Ease Sessions",type:"day",cat:"Steadiness",targets:{FN:3,EM:2},intensity:"gentle",format:"Four sessions on the felt side of money rather than the arithmetic of it. Sessions only, and the lowest cost program Lifed runs.",design:"it works on how money feels to live with, which is the part that tracks wellbeing, rather than on an amount you cannot change this month.",walk:"A steadier relationship with a pressure that is not going away this week. Perceived financial strain tracks wellbeing beyond income itself.",cite:"Financial strain. Netemeyer and colleagues, 2018",host:"Arun Pillai",nextDates:"Tuesdays from 12 Aug",placesLeft:12,price:"₹3,600"},{id:"curiosity-lab",name:"Curiosity Lab",type:"day",cat:"Growth",targets:{CG:3,MN:1,AG:1},intensity:"moderate",format:"Six short evening sessions, each led by a different practitioner, with nothing to prepare.",design:"it puts learning back within reach without asking you to commit to a subject first, which suits an appetite that has gone quiet rather than disappeared.",walk:"A restarted appetite, and six things you did not know. Engagement and learning are consistently associated with flourishing.",cite:"Engagement and growth. Diener and colleagues, 2010",host:"Rotating faculty",nextDates:"Thursdays from 14 Aug",placesLeft:10,price:"₹5,400"},{id:"kalari-beginners",name:"Kalaripayattu Beginners",type:"day",cat:"Movement",targets:{PH:2,EN:3,AG:2},intensity:"active",format:"Eight weekly sessions of one hour, taught from the very beginning. Sessions only.",design:"it rebuilds energy through structured movement rather than through rest, which suits a body that is under used rather than overspent.",walk:"A foundation in a practice with centuries behind it. Breath led traditional movement is linked in reviews to lower perceived stress.",cite:"Gentle breath led movement. Sharma, 2014",host:"Gurukkal Sanjay",nextDates:"Saturdays from 9 Aug",placesLeft:5,price:"₹10,400"},{id:"breathing-basics",name:"Breathing Basics",type:"day",cat:"Settling",targets:{EM:3,EN:1},intensity:"gentle",format:"Three sessions of thirty minutes, online, joined from wherever you are.",design:"it is the smallest possible entry point, and it asks for ninety minutes of your life in total.",walk:"A settling technique that works in a corridor. Slow, comfortable breathing is associated with greater self reported calm.",cite:"Slow comfortable breathing. Zaccaro and colleagues, 2018",host:"Anand Varma",nextDates:"Online, any week",placesLeft:20,price:"₹1,900"}],ep=e=>({PH:"okay",EM:"okay",EN:"okay",RL:"okay",MN:"okay",AG:"okay",FN:"okay",CG:"okay",EV:"okay",...e}),em=[{id:"stretched",label:"Stretched, uneven",note:"Full catalogue, residential eligible",capture:{affect:{v:.34,a:.74},sort:ep({PH:"care",EN:"care",MN:"strength",CG:"strength",EV:"strength"}),body:["jaw","shoulders"],bodySeen:!0,ins:4,phq1:1,phq2:0}},{id:"broad",label:"Running low, broadly",note:"Low reserve, active formats withheld",capture:{affect:{v:.22,a:.24},sort:ep({PH:"care",EM:"care",EN:"care",RL:"care",AG:"care"}),body:["head","shoulders","chest"],bodySeen:!0,ins:2,phq1:1,phq2:1}},{id:"steady",label:"Broadly steady",note:"Nothing stretched, the page reframes",capture:{affect:{v:.78,a:.55},sort:ep({PH:"strength",EM:"strength",RL:"strength",MN:"strength",CG:"strength"}),body:[],bodySeen:!0,ins:5,phq1:0,phq2:0}},{id:"note",label:"Distress, note tier",note:"Day only, gentle and moderate only",capture:{affect:{v:.3,a:.4},sort:ep({EM:"care",EN:"care",MN:"care"}),body:["chest"],bodySeen:!0,ins:3,phq1:2,phq2:1}},{id:"signpost",label:"Distress, signpost tier",note:"Banner leads the page, day only",capture:{affect:{v:.18,a:.3},sort:ep({EM:"care",PH:"care",RL:
