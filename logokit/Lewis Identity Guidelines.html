document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ace {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"31f20ce7-084c-475a-8448-db182bc742a8\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"65eab309-f702-480e-b31d-4ab6e9e0b42b\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f9a2f5f5-3678-4674-a699-faf6f9c5eca0\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"50bd06ea-f00c-4a5d-a603-a2a982b954c1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    *{box-sizing:border-box}\n    html,body{margin:0}\n    body{background:#e6f2ee;font-family:\"Nunito\",system-ui,sans-serif;color:#16302b;-webkit-font-smoothing:antialiased}\n    a{color:#00ae9d;text-decoration:none}\n    a:hover{color:#068c7f}\n    @keyframes lwTurn{0%,14%{transform:rotate(0deg)}46%,100%{transform:rotate(180deg)}}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"lw\" sc-camel-view-box=\"0 0 82 82\">\n    <path d=\"M11 41 V11 H41\" fill=\"none\" stroke=\"#00ae9d\" stroke-width=\"22\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n    <path d=\"M71 41 V71 H41\" fill=\"none\" stroke=\"#5fbb46\" stroke-width=\"22\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n    <circle cx=\"41\" cy=\"41\" r=\"11\" fill=\"#00ae9d\"><\u002Fcircle>\n    <circle cx=\"71\" cy=\"11\" r=\"7\" fill=\"#5fbb46\"><\u002Fcircle>\n    <circle cx=\"11\" cy=\"71\" r=\"7\" fill=\"#00ae9d\"><\u002Fcircle>\n  <\u002Fsymbol>\n  <symbol id=\"lw-mono\" sc-camel-view-box=\"0 0 82 82\">\n    <path d=\"M11 41 V11 H41\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"22\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n    <path d=\"M71 41 V71 H41\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"22\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n    <circle cx=\"41\" cy=\"41\" r=\"11\" fill=\"currentColor\"><\u002Fcircle>\n    <circle cx=\"71\" cy=\"11\" r=\"7\" fill=\"currentColor\"><\u002Fcircle>\n    <circle cx=\"11\" cy=\"71\" r=\"7\" fill=\"currentColor\"><\u002Fcircle>\n  <\u002Fsymbol>\n  <symbol id=\"lw-upper\" sc-camel-view-box=\"0 0 82 82\">\n    <path d=\"M11 41 V11 H41\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"22\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n  <\u002Fsymbol>\n<\u002Fsvg>\n\n<div style=\"max-width:1180px;margin:0 auto;padding:0 clamp(20px,4vw,56px) 110px\">\n\n  <!-- ============ COVER ============ -->\n  <header style=\"display:flex;align-items:center;gap:clamp(28px,5vw,72px);flex-wrap:wrap;padding:clamp(56px,7vw,96px) 0 clamp(40px,5vw,64px)\">\n    <svg width=\"150\" height=\"150\" sc-camel-view-box=\"0 0 82 82\" style=\"flex:none\"><use href=\"#lw\"><\u002Fuse><\u002Fsvg>\n    <div style=\"flex:1 1 380px\">\n      <div style=\"font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;letter-spacing:.26em;color:#0a8577\">LEWIS · BY LIFED<\u002Fdiv>\n      <h1 style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(40px,5.6vw,62px);line-height:1;letter-spacing:-.035em;color:#16302b;margin:14px 0 0\">Identity guidelines<\u002Fh1>\n      <p style=\"font-family:'Nunito',sans-serif;font-size:17px;line-height:1.6;color:rgba(22,48,43,.62);margin:16px 0 0;max-width:52ch;text-wrap:pretty\">The Mirror mark, its construction, its colour behaviour and the rules that keep it recognisably part of Lifed. Version 1.0, {{ docDate }}.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ============ 01 STORY ============ -->\n  <section style=\"padding:clamp(36px,4vw,52px) 0;border-top:1px solid rgba(22,48,43,.12)\">\n    <div style=\"display:flex;gap:clamp(28px,4vw,64px);flex-wrap:wrap\">\n      <div style=\"flex:0 0 132px\">\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;letter-spacing:.06em;color:rgba(22,48,43,.35)\">01<\u002Fdiv>\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em;color:#16302b;margin-top:4px\">Story<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 480px\">\n        <h2 style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(28px,3.4vw,40px);line-height:1.1;letter-spacing:-.03em;color:#16302b;margin:0\">Lewis does not score you. It turns you around.<\u002Fh2>\n        <p style=\"font-family:'Nunito',sans-serif;font-size:16.5px;line-height:1.68;color:rgba(22,48,43,.68);margin:18px 0 0;max-width:64ch;text-wrap:pretty\">Most wellbeing tools take what you tell them and hand back a number. Lewis takes the same material and hands back a likeness. Six minutes of quiet questions, nine domains of evidence, nothing invented on your behalf. What returns is your own life, arranged so that you can finally see the shape of it.<\u002Fp>\n        <p style=\"font-family:'Nunito',sans-serif;font-size:16.5px;line-height:1.68;color:rgba(22,48,43,.68);margin:14px 0 0;max-width:64ch;text-wrap:pretty\">The mark is that gesture, drawn once. Two identical arms, one turned through half a circle onto the other. The upper arm is what you give. The lower arm is the same thing returned. Because the two halves are identical, the mark can never be read as a system talking down to a person: it is one voice, twice.<\u002Fp>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-top:26px\">\n          <div style=\"flex:1 1 220px;background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:20px;padding:20px 22px\">\n            <div style=\"font-family:'Nunito',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.2em;color:#0a8577;margin-bottom:8px\">THE ARMS<\u002Fdiv>\n            <p style=\"font-family:'Nunito',sans-serif;font-size:14.5px;line-height:1.55;color:rgba(22,48,43,.62);margin:0;text-wrap:pretty\">Given and returned. Identical geometry, one rotated 180 degrees about the centre.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 220px;background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:20px;padding:20px 22px\">\n            <div style=\"font-family:'Nunito',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.2em;color:#0a8577;margin-bottom:8px\">THE POINT<\u002Fdiv>\n            <p style=\"font-family:'Nunito',sans-serif;font-size:14.5px;line-height:1.55;color:rgba(22,48,43,.62);margin:0;text-wrap:pretty\">The person, held at the centre and never enclosed. Lewis is the geometry around them.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 220px;background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:20px;padding:20px 22px\">\n            <div style=\"font-family:'Nunito',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.2em;color:#0a8577;margin-bottom:8px\">THE COUNTERPOINTS<\u002Fdiv>\n            <p style=\"font-family:'Nunito',sans-serif;font-size:14.5px;line-height:1.55;color:rgba(22,48,43,.62);margin:0;text-wrap:pretty\">Two small dots on the open diagonal. The parts of a life still unaccounted for.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 02 ANATOMY ============ -->\n  <section style=\"padding:clamp(36px,4vw,52px) 0;border-top:1px solid rgba(22,48,43,.12)\">\n    <div style=\"display:flex;gap:clamp(28px,4vw,64px);flex-wrap:wrap\">\n      <div style=\"flex:0 0 132px\">\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;letter-spacing:.06em;color:rgba(22,48,43,.35)\">02<\u002Fdiv>\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em;color:#16302b;margin-top:4px\">Anatomy<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 480px;display:flex;gap:28px;flex-wrap:wrap;align-items:center\">\n        <div style=\"flex:1 1 300px;background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:24px;padding:34px;display:flex;justify-content:center\">\n          <svg width=\"100%\" sc-camel-view-box=\"-58 -22 198 126\" style=\"display:block;max-width:340px\">\n            <g fill=\"none\" stroke=\"#c67139\" stroke-width=\".8\" opacity=\".75\" stroke-dasharray=\"3 3\">\n              <path d=\"M11 41 L-14 24\"><\u002Fpath>\n              <path d=\"M71 41 L96 58\"><\u002Fpath>\n              <path d=\"M41 41 L96 41\"><\u002Fpath>\n              <path d=\"M71 11 L96 -6\"><\u002Fpath>\n            <\u002Fg>\n            <use href=\"#lw\"><\u002Fuse>\n            <g font-family=\"Nunito, sans-serif\" font-size=\"5.2\" font-weight=\"700\" fill=\"#c67139\">\n              <text x=\"-18\" y=\"22\" text-anchor=\"end\">GIVEN<\u002Ftext>\n              <text x=\"100\" y=\"60\">RETURNED<\u002Ftext>\n              <text x=\"100\" y=\"43\">CENTRE<\u002Ftext>\n              <text x=\"100\" y=\"-4\">COUNTERPOINT<\u002Ftext>\n            <\u002Fg>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 240px\">\n          <p style=\"font-family:'Nunito',sans-serif;font-size:15.5px;line-height:1.65;color:rgba(22,48,43,.66);margin:0;text-wrap:pretty\">Five elements, no more. The upper arm reads first because it carries the brand teal and the heavier optical mass. The lower arm answers in Lifed green. The centre disc is always teal and always full cell size, so the eye lands on the person before it reads the frame.<\u002Fp>\n          <ul style=\"font-family:'Nunito',sans-serif;font-size:14.5px;line-height:1.75;color:rgba(22,48,43,.62);margin:16px 0 0;padding-left:18px\">\n            <li>Arms: 22 unit stroke, round cap, round join<\u002Fli>\n            <li>Centre disc: 22 unit diameter, teal<\u002Fli>\n            <li>Counterpoints: 14 unit diameter, one of each colour<\u002Fli>\n            <li>Rotational symmetry: 180 degrees about 41, 41<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 03 CONSTRUCTION ============ -->\n  <section style=\"padding:clamp(36px,4vw,52px) 0;border-top:1px solid rgba(22,48,43,.12)\">\n    <div style=\"display:flex;gap:clamp(28px,4vw,64px);flex-wrap:wrap\">\n      <div style=\"flex:0 0 132px\">\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;letter-spacing:.06em;color:rgba(22,48,43,.35)\">03<\u002Fdiv>\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em;color:#16302b;margin-top:4px\">Grid<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 480px\">\n        <p style=\"font-family:'Nunito',sans-serif;font-size:16px;line-height:1.65;color:rgba(22,48,43,.66);margin:0 0 24px;max-width:60ch;text-wrap:pretty\">The mark is drawn on the same three by three module as the Lifed mark. One unit equals one eighty-second of the mark width, so every measurement below scales with the logo.<\u002Fp>\n        <div style=\"display:flex;gap:20px;flex-wrap:wrap\">\n          <div style=\"flex:1 1 320px;background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:24px;padding:30px;display:flex;justify-content:center\">\n            <svg width=\"320\" height=\"320\" sc-camel-view-box=\"-6 -6 94 94\">\n              <g fill=\"none\" stroke=\"#c67139\" opacity=\".55\">\n                <rect x=\"0\" y=\"0\" width=\"82\" height=\"82\" stroke-width=\".8\" stroke-dasharray=\"4 3\"><\u002Frect>\n                <g stroke-width=\".6\">\n                  <circle cx=\"11\" cy=\"11\" r=\"11\"><\u002Fcircle><circle cx=\"41\" cy=\"11\" r=\"11\"><\u002Fcircle><circle cx=\"71\" cy=\"11\" r=\"11\"><\u002Fcircle>\n                  <circle cx=\"11\" cy=\"41\" r=\"11\"><\u002Fcircle><circle cx=\"41\" cy=\"41\" r=\"11\"><\u002Fcircle><circle cx=\"71\" cy=\"41\" r=\"11\"><\u002Fcircle>\n                  <circle cx=\"11\" cy=\"71\" r=\"11\"><\u002Fcircle><circle cx=\"41\" cy=\"71\" r=\"11\"><\u002Fcircle><circle cx=\"71\" cy=\"71\" r=\"11\"><\u002Fcircle>\n                <\u002Fg>\n                <path d=\"M11 -6 V88 M41 -6 V88 M71 -6 V88 M-6 11 H88 M-6 41 H88 M-6 71 H88\" stroke-width=\".4\" stroke-dasharray=\"2 3\"><\u002Fpath>\n              <\u002Fg>\n              <g opacity=\".9\"><use href=\"#lw\"><\u002Fuse><\u002Fg>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 240px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:16px;padding:15px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px\">\n              <span style=\"font-family:'Nunito',sans-serif;font-size:14px;color:rgba(22,48,43,.6)\">Artboard<\u002Fspan><span style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;color:#16302b\">82 × 82<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:16px;padding:15px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px\">\n              <span style=\"font-family:'Nunito',sans-serif;font-size:14px;color:rgba(22,48,43,.6)\">Cell<\u002Fspan><span style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;color:#16302b\">22<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:16px;padding:15px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px\">\n              <span style=\"font-family:'Nunito',sans-serif;font-size:14px;color:rgba(22,48,43,.6)\">Pitch<\u002Fspan><span style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;color:#16302b\">30<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:16px;padding:15px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px\">\n              <span style=\"font-family:'Nunito',sans-serif;font-size:14px;color:rgba(22,48,43,.6)\">Gap<\u002Fspan><span style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;color:#16302b\">8<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:16px;padding:15px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px\">\n              <span style=\"font-family:'Nunito',sans-serif;font-size:14px;color:rgba(22,48,43,.6)\">Radius<\u002Fspan><span style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;color:#16302b\">11, always half<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:16px;padding:15px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px\">\n              <span style=\"font-family:'Nunito',sans-serif;font-size:14px;color:rgba(22,48,43,.6)\">Counterpoint<\u002Fspan><span style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;color:#16302b\">14 diameter<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 04 CLEAR SPACE & SIZE ============ -->\n  <section style=\"padding:clamp(36px,4vw,52px) 0;border-top:1px solid rgba(22,48,43,.12)\">\n    <div style=\"display:flex;gap:clamp(28px,4vw,64px);flex-wrap:wrap\">\n      <div style=\"flex:0 0 132px\">\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;letter-spacing:.06em;color:rgba(22,48,43,.35)\">04<\u002Fdiv>\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em;color:#16302b;margin-top:4px\">Space and size<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 480px;display:flex;gap:20px;flex-wrap:wrap\">\n        <div style=\"flex:1 1 300px;background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:24px;padding:30px\">\n          <svg width=\"100%\" sc-camel-view-box=\"-30 -30 142 142\" style=\"display:block\">\n            <rect x=\"-25\" y=\"-25\" width=\"132\" height=\"132\" fill=\"none\" stroke=\"#c67139\" stroke-width=\".8\" stroke-dasharray=\"4 3\" opacity=\".6\"><\u002Frect>\n            <rect x=\"-25\" y=\"-25\" width=\"22\" height=\"22\" fill=\"#c67139\" opacity=\".16\"><\u002Frect>\n            <text x=\"-24\" y=\"-28\" font-family=\"Nunito, sans-serif\" font-size=\"6\" font-weight=\"700\" fill=\"#c67139\">CLEAR SPACE = 1 CELL<\u002Ftext>\n            <use href=\"#lw\"><\u002Fuse>\n          <\u002Fsvg>\n          <p style=\"font-family:'Nunito',sans-serif;font-size:14.5px;line-height:1.6;color:rgba(22,48,43,.62);margin:18px 0 0;text-wrap:pretty\">Keep one full cell, 22 units or 27 percent of the mark width, clear on every side. Nothing sets inside it, including the wordmark, rules and photo edges.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 300px;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:24px;padding:26px 28px\">\n            <div style=\"font-family:'Nunito',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.2em;color:#0a8577;margin-bottom:18px\">MINIMUM SIZES<\u002Fdiv>\n            <div style=\"display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap\">\n              <div style=\"display:flex;flex-direction:column;align-items:center;gap:9px\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 82 82\"><use href=\"#lw\"><\u002Fuse><\u002Fsvg>\n                <span style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;color:#16302b\">16 px<\u002Fspan>\n                <span style=\"font-family:'Nunito',sans-serif;font-size:11.5px;color:rgba(22,48,43,.5)\">favicon only<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;align-items:center;gap:9px\">\n                <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 82 82\"><use href=\"#lw\"><\u002Fuse><\u002Fsvg>\n                <span style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;color:#16302b\">24 px<\u002Fspan>\n                <span style=\"font-family:'Nunito',sans-serif;font-size:11.5px;color:rgba(22,48,43,.5)\">screen minimum<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;align-items:center;gap:9px\">\n                <svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 82 82\"><use href=\"#lw\"><\u002Fuse><\u002Fsvg>\n                <span style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;color:#16302b\">40 px<\u002Fspan>\n                <span style=\"font-family:'Nunito',sans-serif;font-size:11.5px;color:rgba(22,48,43,.5)\">with wordmark<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;align-items:center;gap:9px\">\n                <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 82 82\"><use href=\"#lw\"><\u002Fuse><\u002Fsvg>\n                <span style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;color:#16302b\">8 mm<\u002Fspan>\n                <span style=\"font-family:'Nunito',sans-serif;font-size:11.5px;color:rgba(22,48,43,.5)\">print minimum<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:24px;padding:26px 28px\">\n            <div style=\"font-family:'Nunito',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.2em;color:#0a8577;margin-bottom:12px\">BELOW 24 PX<\u002Fdiv>\n            <p style=\"font-family:'Nunito',sans-serif;font-size:14.5px;line-height:1.6;color:rgba(22,48,43,.62);margin:0;text-wrap:pretty\">Drop the two counterpoints and keep the arms and centre only. The mark stays balanced and the small dots never turn to mush.<\u002Fp>\n            <div style=\"display:flex;align-items:center;gap:18px;margin-top:16px\">\n              <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 82 82\">\n                <path d=\"M11 41 V11 H41\" fill=\"none\" stroke=\"#00ae9d\" stroke-width=\"22\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n                <path d=\"M71 41 V71 H41\" fill=\"none\" stroke=\"#5fbb46\" stroke-width=\"22\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n                <circle cx=\"41\" cy=\"41\" r=\"11\" fill=\"#00ae9d\"><\u002Fcircle>\n              <\u002Fsvg>\n              <svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 82 82\">\n                <path d=\"M11 41 V11 H41\" fill=\"none\" stroke=\"#00ae9d\" stroke-width=\"22\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n                <path d=\"M71 41 V71 H41\" fill=\"none\" stroke=\"#5fbb46\" stroke-width=\"22\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n                <circle cx=\"41\" cy=\"41\" r=\"11\" fill=\"#00ae9d\"><\u002Fcircle>\n              <\u002Fsvg>\n              <span style=\"font-family:'Nunito',sans-serif;font-size:13px;color:rgba(22,48,43,.5)\">simplified mark<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 05 COLOUR ============ -->\n  <section style=\"padding:clamp(36px,4vw,52px) 0;border-top:1px solid rgba(22,48,43,.12)\">\n    <div style=\"display:flex;gap:clamp(28px,4vw,64px);flex-wrap:wrap\">\n      <div style=\"flex:0 0 132px\">\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;letter-spacing:.06em;color:rgba(22,48,43,.35)\">05<\u002Fdiv>\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em;color:#16302b;margin-top:4px\">Colour<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 480px\">\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n          <div style=\"flex:1 1 165px;background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:20px;overflow:hidden\">\n            <div style=\"height:82px;background:#00ae9d\"><\u002Fdiv>\n            <div style=\"padding:14px 16px\">\n              <div style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;color:#16302b\">Lifed Teal<\u002Fdiv>\n              <div style=\"font-family:'Nunito',sans-serif;font-size:12.5px;line-height:1.5;color:rgba(22,48,43,.55);margin-top:3px\">#00AE9D<br>0 174 157<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 165px;background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:20px;overflow:hidden\">\n            <div style=\"height:82px;background:#5fbb46\"><\u002Fdiv>\n            <div style=\"padding:14px 16px\">\n              <div style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;color:#16302b\">Lifed Green<\u002Fdiv>\n              <div style=\"font-family:'Nunito',sans-serif;font-size:12.5px;line-height:1.5;color:rgba(22,48,43,.55);margin-top:3px\">#5FBB46<br>95 187 70<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 165px;background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:20px;overflow:hidden\">\n            <div style=\"height:82px;background:#0a8577\"><\u002Fdiv>\n            <div style=\"padding:14px 16px\">\n              <div style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;color:#16302b\">Deep Teal<\u002Fdiv>\n              <div style=\"font-family:'Nunito',sans-serif;font-size:12.5px;line-height:1.5;color:rgba(22,48,43,.55);margin-top:3px\">#0A8577<br>text on light<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 165px;background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:20px;overflow:hidden\">\n            <div style=\"height:82px;background:#16302b\"><\u002Fdiv>\n            <div style=\"padding:14px 16px\">\n              <div style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;color:#16302b\">Ink<\u002Fdiv>\n              <div style=\"font-family:'Nunito',sans-serif;font-size:12.5px;line-height:1.5;color:rgba(22,48,43,.55);margin-top:3px\">#16302B<br>22 48 43<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 165px;background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:20px;overflow:hidden\">\n            <div style=\"height:82px;background:#e6f2ee\"><\u002Fdiv>\n            <div style=\"padding:14px 16px\">\n              <div style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;color:#16302b\">Mist<\u002Fdiv>\n              <div style=\"font-family:'Nunito',sans-serif;font-size:12.5px;line-height:1.5;color:rgba(22,48,43,.55);margin-top:3px\">#E6F2EE<br>page ground<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-family:'Nunito',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.2em;color:#0a8577;margin:30px 0 14px\">APPROVED VERSIONS<\u002Fdiv>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n          <div style=\"flex:1 1 150px;border-radius:20px;overflow:hidden;border:1px solid rgba(22,48,43,.08)\">\n            <div style=\"height:130px;background:#fff;display:flex;align-items:center;justify-content:center\"><svg width=\"62\" height=\"62\" sc-camel-view-box=\"0 0 82 82\"><use href=\"#lw\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <div style=\"background:#fff;border-top:1px solid rgba(22,48,43,.07);padding:12px 14px;font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:600;color:rgba(22,48,43,.6)\">Duotone on white<br><span style=\"font-weight:400;opacity:.75\">primary<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 150px;border-radius:20px;overflow:hidden;border:1px solid rgba(22,48,43,.08)\">\n            <div style=\"height:130px;background:#e6f2ee;display:flex;align-items:center;justify-content:center\"><svg width=\"62\" height=\"62\" sc-camel-view-box=\"0 0 82 82\"><use href=\"#lw\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <div style=\"background:#fff;border-top:1px solid rgba(22,48,43,.07);padding:12px 14px;font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:600;color:rgba(22,48,43,.6)\">Duotone on mist<br><span style=\"font-weight:400;opacity:.75\">app and web<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 150px;border-radius:20px;overflow:hidden;border:1px solid rgba(22,48,43,.08)\">\n            <div style=\"height:130px;background:#0a8577;display:flex;align-items:center;justify-content:center\"><svg width=\"62\" height=\"62\" sc-camel-view-box=\"0 0 82 82\" style=\"color:#fff\"><use href=\"#lw-mono\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <div style=\"background:#fff;border-top:1px solid rgba(22,48,43,.07);padding:12px 14px;font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:600;color:rgba(22,48,43,.6)\">White reversed<br><span style=\"font-weight:400;opacity:.75\">on deep teal or ink<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 150px;border-radius:20px;overflow:hidden;border:1px solid rgba(22,48,43,.08)\">\n            <div style=\"height:130px;background:#fff;display:flex;align-items:center;justify-content:center;color:#16302b\"><svg width=\"62\" height=\"62\" sc-camel-view-box=\"0 0 82 82\"><use href=\"#lw-mono\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <div style=\"background:#fff;border-top:1px solid rgba(22,48,43,.07);padding:12px 14px;font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:600;color:rgba(22,48,43,.6)\">Ink single colour<br><span style=\"font-weight:400;opacity:.75\">documents, fax, engraving<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 150px;border-radius:20px;overflow:hidden;border:1px solid rgba(22,48,43,.08)\">\n            <div style=\"height:130px;background:#fff;display:flex;align-items:center;justify-content:center;color:#00ae9d\"><svg width=\"62\" height=\"62\" sc-camel-view-box=\"0 0 82 82\"><use href=\"#lw-mono\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <div style=\"background:#fff;border-top:1px solid rgba(22,48,43,.07);padding:12px 14px;font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:600;color:rgba(22,48,43,.6)\">Teal single colour<br><span style=\"font-weight:400;opacity:.75\">one ink print, embroidery<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-family:'Nunito',sans-serif;font-size:14.5px;line-height:1.6;color:rgba(22,48,43,.6);margin:18px 0 0;max-width:70ch;text-wrap:pretty\">Teal always leads. The green arm never carries the centre disc, and the two colours are never swapped, because the reading order of given then returned depends on teal coming first.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 06 LOCKUPS ============ -->\n  <section style=\"padding:clamp(36px,4vw,52px) 0;border-top:1px solid rgba(22,48,43,.12)\">\n    <div style=\"display:flex;gap:clamp(28px,4vw,64px);flex-wrap:wrap\">\n      <div style=\"flex:0 0 132px\">\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;letter-spacing:.06em;color:rgba(22,48,43,.35)\">06<\u002Fdiv>\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em;color:#16302b;margin-top:4px\">Lockups<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 480px;display:flex;gap:16px;flex-wrap:wrap\">\n        <div style=\"flex:1 1 300px;background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:24px;padding:30px 32px\">\n          <div style=\"display:flex;align-items:center;gap:16px\">\n            <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 82 82\" style=\"flex:none\"><use href=\"#lw\"><\u002Fuse><\u002Fsvg>\n            <div style=\"line-height:1\">\n              <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:33px;letter-spacing:-.025em;color:#16302b\">Lewis<\u002Fdiv>\n              <div style=\"font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;letter-spacing:.24em;color:rgba(22,48,43,.5);margin-top:6px\">{{ subline }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'Nunito',sans-serif;font-size:13.5px;line-height:1.55;color:rgba(22,48,43,.55);margin-top:22px\">Primary horizontal. Wordmark cap height equals the mark height. Gap between mark and wordmark equals one cell.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 220px;background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:24px;padding:30px 32px;display:flex;flex-direction:column;align-items:center;text-align:center\">\n          <svg width=\"58\" height=\"58\" sc-camel-view-box=\"0 0 82 82\"><use href=\"#lw\"><\u002Fuse><\u002Fsvg>\n          <div style=\"font- flex:1 1 290px;background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:24px;padding:28px 30px\">\n          <div style=\"font-family:'Nunito',sans-serif;font-weight:400;font-size:22px;line-height:1.45;color:#16302b\">Wellbeing intelligence, one calm question at a time.<\u002Fdiv>\n          <div style=\"font-family:'Nunito',sans-serif;font-size:14px;line-height:1.6;color:rgba(22,48,43,.6);margin-top:16px\">Nunito for everything the person reads. Regular for body, Bold 700 for the endorsement line at 24 percent tracking.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 08 MOTION ============ -->\n  <section style=\"padding:clamp(36px,4vw,52px) 0;border-top:1px solid rgba(22,48,43,.12)\">\n    <div style=\"display:flex;gap:clamp(28px,4vw,64px);flex-wrap:wrap\">\n      <div style=\"flex:0 0 132px\">\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;letter-spacing:.06em;color:rgba(22,48,43,.35)\">08<\u002Fdiv>\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em;color:#16302b;margin-top:4px\">Motion<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 480px;display:flex;gap:20px;flex-wrap:wrap;align-items:center\">\n        <div style=\"flex:0 1 260px;background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:24px;height:220px;display:flex;align-items:center;justify-content:center\">\n          <svg width=\"110\" height=\"110\" sc-camel-view-box=\"0 0 82 82\">\n            <circle cx=\"41\" cy=\"41\" r=\"11\" fill=\"#00ae9d\"><\u002Fcircle>\n            <circle cx=\"71\" cy=\"11\" r=\"7\" fill=\"#5fbb46\"><\u002Fcircle>\n            <circle cx=\"11\" cy=\"71\" r=\"7\" fill=\"#00ae9d\"><\u002Fcircle>\n            <g style=\"color:#00ae9d\"><use href=\"#lw-upper\"><\u002Fuse><\u002Fg>\n            <g style=\"color:#5fbb46;transform-origin:41px 41px;animation:lwTurn 3.6s cubic-bezier(.6,0,.2,1) infinite\"><use href=\"#lw-upper\"><\u002Fuse><\u002Fg>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 260px\">\n          <p style=\"font-family:'Nunito',sans-serif;font-size:15.5px;line-height:1.65;color:rgba(22,48,43,.66);margin:0;text-wrap:pretty\">The only sanctioned animation is the turn: the second arm rotates 180 degrees about the centre and settles. 900ms, ease in out, no bounce. Use it once per session, on the synthesis screen, as the report is assembled.<\u002Fp>\n          <ul style=\"font-family:'Nunito',sans-serif;font-size:14.5px;line-height:1.75;color:rgba(22,48,43,.62);margin:14px 0 0;padding-left:18px\">\n            <li>Rotation origin is always the centre disc<\u002Fli>\n            <li>The counterpoints and centre never move<\u002Fli>\n            <li>Respect reduced motion: show the resolved mark<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 09 MISUSE ============ -->\n  <section style=\"padding:clamp(36px,4vw,52px) 0;border-top:1px solid rgba(22,48,43,.12)\">\n    <div style=\"display:flex;gap:clamp(28px,4vw,64px);flex-wrap:wrap\">\n      <div style=\"flex:0 0 132px\">\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;letter-spacing:.06em;color:rgba(22,48,43,.35)\">09<\u002Fdiv>\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em;color:#16302b;margin-top:4px\">Misuse<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 480px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px\">\n        <div style=\"background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:20px;padding:20px;text-align:center\">\n          <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 82 82\" style=\"transform:rotate(28deg)\"><use href=\"#lw\"><\u002Fuse><\u002Fsvg>\n          <div style=\"font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:600;color:rgba(22,48,43,.6);margin-top:14px\">Never rotate<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:20px;padding:20px;text-align:center\">\n          <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 82 82\" style=\"transform:scaleX(1.4)\"><use href=\"#lw\"><\u002Fuse><\u002Fsvg>\n          <div style=\"font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:600;color:rgba(22,48,43,.6);margin-top:14px\">Never stretch<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:20px;padding:20px;text-align:center\">\n          <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 82 82\" style=\"filter:hue-rotate(150deg) saturate(1.6)\"><use href=\"#lw\"><\u002Fuse><\u002Fsvg>\n          <div style=\"font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:600;color:rgba(22,48,43,.6);margin-top:14px\">Never recolour<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:20px;padding:20px;text-align:center\">\n          <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 82 82\">\n            <path d=\"M71 41 V11 H41\" fill=\"none\" stroke=\"#5fbb46\" stroke-width=\"22\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n            <path d=\"M11 41 V71 H41\" fill=\"none\" stroke=\"#00ae9d\" stroke-width=\"22\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n            <circle cx=\"41\" cy=\"41\" r=\"11\" fill=\"#5fbb46\"><\u002Fcircle>\n          <\u002Fsvg>\n          <div style=\"font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:600;color:rgba(22,48,43,.6);margin-top:14px\">Never mirror or swap colours<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:20px;padding:20px;text-align:center\">\n          <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 82 82\" style=\"filter:drop-shadow(0 6px 5px rgba(22,48,43,.5))\"><use href=\"#lw\"><\u002Fuse><\u002Fsvg>\n          <div style=\"font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:600;color:rgba(22,48,43,.6);margin-top:14px\">Never add effects<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:20px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center\">\n          <div style=\"display:flex;align-items:center;gap:2px\">\n            <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 82 82\"><use href=\"#lw\"><\u002Fuse><\u002Fsvg>\n            <span style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;color:#16302b\">Lewis<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:600;color:rgba(22,48,43,.6);margin-top:14px\">Never crowd the clear space<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 10 ASSETS ============ -->\n  <section style=\"padding:clamp(36px,4vw,52px) 0 0;border-top:1px solid rgba(22,48,43,.12)\">\n    <div style=\"display:flex;gap:clamp(28px,4vw,64px);flex-wrap:wrap\">\n      <div style=\"flex:0 0 132px\">\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;letter-spacing:.06em;color:rgba(22,48,43,.35)\">10<\u002Fdiv>\n        <div style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em;color:#16302b;margin-top:4px\">Files<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 480px\">\n        <div style=\"background:#fff;border:1px solid rgba(22,48,43,.08);border-radius:24px;overflow:hidden\">\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:16px 22px;border-bottom:1px solid rgba(22,48,43,.07);font-family:'Nunito',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.2em;color:rgba(22,48,43,.45)\"><span>FILE<\u002Fspan><span>USE<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 22px;border-bottom:1px solid rgba(22,48,43,.06)\"><span style=\"font-family:'Manrope',sans-serif;font-weight:600;font-size:14.5px;color:#16302b\">lewis-mark.svg<\u002Fspan><span style=\"font-family:'Nunito',sans-serif;font-size:14px;color:rgba(22,48,43,.55)\">Primary duotone<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 22px;border-bottom:1px solid rgba(22,48,43,.06)\"><span style=\"font-family:'Manrope',sans-serif;font-weight:600;font-size:14.5px;color:#16302b\">lewis-mark-white.svg<\u002Fspan><span style=\"font-family:'Nunito',sans-serif;font-size:14px;color:rgba(22,48,43,.55)\">Reversed on dark<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 22px;border-bottom:1px solid rgba(22,48,43,.06)\"><span style=\"font-family:'Manrope',sans-serif;font-weight:600;font-size:14.5px;color:#16302b\">lewis-mark-ink.svg<\u002Fspan><span style=\"font-family:'Nunito',sans-serif;font-size:14px;color:rgba(22,48,43,.55)\">Single colour documents<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 22px;border-bottom:1px solid rgba(22,48,43,.06)\"><span style=\"font-family:'Manrope',sans-serif;font-weight:600;font-size:14.5px;color:#16302b\">lewis-mark-teal.svg<\u002Fspan><span style=\"font-family:'Nunito',sans-serif;font-size:14px;color:rgba(22,48,43,.55)\">One ink print, stitching<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 22px;border-bottom:1px solid rgba(22,48,43,.06)\"><span style=\"font-family:'Manrope',sans-serif;font-weight:600;font-size:14.5px;color:#16302b\">lewis-mark-currentcolor.svg<\u002Fspan><span style=\"font-family:'Nunito',sans-serif;font-size:14px;color:rgba(22,48,43,.55)\">Inherits CSS colour in code<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 22px\"><span style=\"font-family:'Manrope',sans-serif;font-weight:600;font-size:14.5px;color:#16302b\">lewis-lockup-horizontal.svg<\u002Fspan><span style=\"font-family:'Nunito',sans-serif;font-size:14px;color:rgba(22,48,43,.55)\">Mark plus wordmark<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-family:'Nunito',sans-serif;font-size:14px;line-height:1.6;color:rgba(22,48,43,.55);margin:14px 0 0;text-wrap:pretty\">All files are drawn on the 82 unit artboard with no embedded raster. The lockup calls Manrope by name, so convert its text to outlines before sending it outside the team.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;subline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;BY LIFED&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Lockup&quot;},&quot;docDate&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;August 2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Document&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      subline: this.props.subline ?? \"BY LIFED\",\n      docDate: this.props.docDate ?? \"August 2026\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
