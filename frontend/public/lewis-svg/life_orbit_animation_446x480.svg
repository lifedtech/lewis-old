    <!-- Leaf 1: Accomplishment & Agency -->
    <g id="leaf-ac">
      <path d="M2 46V18C2 9.2 9.2 2 18 2h28v28c0 8.8-7.2 16-16 16Z" fill="#eaf7f5" stroke="#00ae9d" stroke-width="1.2" stroke-opacity="0.35"/>
      <g transform="translate(12 12)" stroke="#017a6f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M3.4 19.6h4.6V15h4.6v-4.6h4.6V5.8h3.4"/>
      </g>
    </g>

    <!-- Leaf 2: Environmental & Cultural -->
