<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#ffffff;font-family:"Nunito",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:#01ad9c;text-decoration:none;}
  a:hover{color:#017a6f;}
  .sci-rail{scrollbar-width:none;-ms-overflow-style:none;}
  .sci-rail::-webkit-scrollbar{display:none;}
</style>
</helmet>
<section style="padding:72px 0 80px;background:#ffffff;">
  <div style="max-width:1180px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:32px;">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;">
      <div style="display:flex;flex-direction:column;gap:10px;max-width:640px;">
        <span style="font-weight:700;font-size:13px;line-height:1.2;letter-spacing:0.09em;text-transform:uppercase;color:#01ad9c;">Research-informed</span>
        <p style="margin:0;font-weight:400;font-size:17px;line-height:1.55;color:#585858;text-wrap:pretty;">Lewis is built based on published, validated measures and peer-reviewed tools and research</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-weight:700;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#a4a5a5;">{{ countLabel }}</span>
        <button type="button" aria-label="Scroll left" onClick="{{ scrollLeft }}" style="width:40px;height:40px;border-radius:999px;border:1px solid #dcdcdc;background:#ffffff;color:#494a4a;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 180ms ease,border-color 180ms ease;" style-hover="background:#eaf7f5;border-color:#6dc6ba;color:#017a6f;">
          <x-import component="Icon" from="./components/Icon.jsx" name="chevron-left" size="{{ 16 }}" hint-size="16px,16px"></x-import>
        </button>
        <button type="button" aria-label="Scroll right" onClick="{{ scrollRight }}" style="width:40px;height:40px;border-radius:999px;border:1px solid #dcdcdc;background:#ffffff;color:#494a4a;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 180ms ease,border-color 180ms ease;" style-hover="background:#eaf7f5;border-color:#6dc6ba;color:#017a6f;">
          <x-import component="Icon" from="./components/Icon.jsx" name="chevron-right" size="{{ 16 }}" hint-size="16px,16px"></x-import>
        </button>
      </div>
    </div>
  </div>

  <div style="position:relative;">
    <div class="sci-rail" ref="{{ railRef }}" style="overflow-x:auto;scroll-behavior:smooth;padding:6px 0 14px;">
      <div style="display:flex;gap:16px;padding:0 max(24px, calc(50vw - 566px));width:max-content;">
        <sc-for list="{{ items }}" as="item" hint-placeholder-count="6">
          <article style="flex:0 0 auto;width:180px;min-height:224px;display:flex;flex-direction:column;justify-content:flex-start;gap:18px;padding:20px;border-radius:16px;border:1px solid #ededed;background:#ffffff;transition:box-shadow 220ms ease,transform 220ms ease,border-color 220ms ease;cursor:default;" style-hover="box-shadow:0 10px 28px rgba(37,38,38,.10);transform:translateY(-3px);border-color:#a7dcd4;">
            <span style="width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:{{ item.wash }};color:{{ item.tone }};">
              <x-import component="Icon" from="./components/Icon.jsx" name="{{ item.icon }}" size="{{ 19 }}" hint-size="19px,19px"></x-import>
            </span>
            <div style="display:flex;flex-direction:column;gap:8px;">
              <span style="font-weight:800;font-size:10px;line-height:1.3;letter-spacing:0.09em;text-transform:uppercase;color:{{ item.tone }};">{{ item.dimension }}</span>
              <span style="font-weight:700;font-size:16px;line-height:1.32;letter-spacing:-0.003em;color:#252626;text-wrap:pretty;">{{ item.name }}</span>
            </div>
          </article>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="max-width:1180px;margin:28px auto 0;padding:0 24px;">
    <a href="#science" style="display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:#01ad9c;">
      <span>See the full methodology</span>
      <x-import component="Icon" from="./components/Icon.jsx" name="arrow-right" size="{{ 15 }}" hint-size="15px,15px"></x-import>
    </a>
  </div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:560}}">
const TEAL = "#019386";
const LEAF = TEAL;

const DATA = [
  ["OVERALL WELLBEING", "WHO\u20115 Well\u2011Being Index", "scale", "gauge"],
  ["EMOTIONAL & MENTAL", "Perceived Stress Scale, PSS\u201110", "scale", "brain"],
  ["RELATIONSHIPS & SOCIAL", "UCLA 3\u2011Item Loneliness Scale", "scale", "users"],
  ["MEANING & SPIRITUAL", "PROMIS Meaning & Purpose, 4\u2011item", "scale", "compass"],
  ["FINANCIAL WELLNESS", "CFPB Financial Well\u2011Being Scale, 5\u2011item", "scale", "wallet"],
  ["INTELLECTUAL & GROWTH", "Diener Flourishing Scale, 8\u2011item", "scale", "sprout"],
  ["ENVIRONMENTAL & CULTURAL", "Inclusion of Nature in Self", "scale", "mountain-snow"],
  ["PHYSICAL & REGENERATION", "A stated composite, and Lewis says so", "scale", "refresh-cw"],
  ["EMOTIONAL STATE", "Circumplex model of affect", "framework", "circle-dot"],
  ["BODY", "Body mapping", "framework", "person-standing"],
  ["NERVOUS SYSTEM", "Self-reported state, asked directly", "framework", "activity"],
  ["REGULATION", "Paced slow breathing", "framework", "wind"],
  ["MOTIVATION", "Delay discounting", "framework", "clock"]
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.rail = React.createRef();
  }
  step(dir) {
    const el = this.rail.current;
    if (!el) return;
    el.scrollBy({ left: dir * 196 * 3, behavior: "smooth" });
  }
  renderVals() {
    const items = DATA.map(([dimension, name, kind, icon]) => ({
      dimension: dimension,
      name: name,
      icon: icon,
      tone: kind === "framework" ? LEAF : TEAL,
      wash: "#eaf7f5"
    }));
    return {
      items: items,
      countLabel: "6 of " + items.length,
      railRef: this.rail,
      scrollLeft: () => this.step(-1),
      scrollRight: () => this.step(1)
    };
  }
}

</script>
</body>
</html>
